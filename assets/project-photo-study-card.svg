<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Photo-to-study mobile app: textbook page to flashcards</title>
  <desc id="desc">A photographed textbook vocabulary page is read by AI into Spanish and English word pairs, reviewed and corrected, then studied in an installable phone flashcard app showing the word "la bandera" with pronounce, star and known buttons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6e2416"/>
      <stop offset="1" stop-color="#c8442b"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset=".6" stop-color="#f7f0e2"/>
      <stop offset="1" stop-color="#e9dfcb"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f0b544" stop-opacity="0"/>
      <stop offset="1" stop-color="#f0b544" stop-opacity=".45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#2a0e08" flood-opacity=".32"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#23201d" flood-opacity=".14"/>
    </filter>
    <clipPath id="panelClip"><rect x="50" y="54" width="800" height="512" rx="28"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#f0b544"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#fdf6ef"/>
  <rect x="50" y="54" width="800" height="512" rx="28" fill="url(#bg)"/>
  <g clip-path="url(#panelClip)">
    <circle cx="150" cy="96" r="120" fill="#f0b544" opacity=".10"/>
    <circle cx="470" cy="560" r="130" fill="#ffffff" opacity=".06"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">

    <!-- 1. Photographed textbook page -->
    <g transform="translate(80 132) rotate(-6 125 160)">
      <g filter="url(#shadow)">
        <rect width="250" height="320" rx="14" fill="#2b2420"/>
      </g>
      <rect x="10" y="10" width="230" height="300" rx="6" fill="url(#paper)"/>
      <rect x="10" y="10" width="230" height="44" rx="6" fill="#2f6fa6"/>
      <rect x="10" y="40" width="230" height="14" fill="#2f6fa6"/>
      <text x="26" y="39" fill="#ffffff" font-size="19" font-weight="850">Vocabulario</text>
      <rect x="24" y="68" width="202" height="226" rx="8" fill="#ffffff" fill-opacity=".7" stroke="#2f6fa6" stroke-opacity=".45" stroke-width="1.5"/>
      <g font-size="15" fill="#2b2420">
        <text x="36" y="98" font-weight="750">la bandera</text>
        <text x="214" y="98" text-anchor="end" fill="#6b625a">flag</text>
        <text x="36" y="134" font-weight="750">la capital</text>
        <text x="214" y="134" text-anchor="end" fill="#6b625a">capital</text>
        <text x="36" y="170" font-weight="750">la chica</text>
        <text x="214" y="170" text-anchor="end" fill="#6b625a">girl</text>
        <text x="36" y="206" font-weight="750">el chico</text>
        <text x="214" y="206" text-anchor="end" fill="#6b625a">boy</text>
        <text x="36" y="242" font-weight="750">el país</text>
        <text x="214" y="242" text-anchor="end" fill="#6b625a">country</text>
      </g>
      <rect x="36" y="262" width="96" height="7" rx="3.5" fill="#c9bfae"/>
      <rect x="36" y="276" width="140" height="7" rx="3.5" fill="#d8cfbf"/>
      <!-- scan band -->
      <rect x="24" y="108" width="202" height="38" fill="url(#scan)"/>
      <line x1="24" x2="226" y1="146" y2="146" stroke="#f0b544" stroke-width="3"/>
      <rect x="10" y="10" width="230" height="300" rx="6" fill="url(#glare)"/>
      <!-- viewfinder corners -->
      <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
        <path d="M-8 22V-8H22"/>
        <path d="M228 -8H258V22"/>
        <path d="M258 298V328H228"/>
        <path d="M22 328H-8V298"/>
      </g>
    </g>

    <!-- step label: snap -->
    <g transform="translate(108 492)">
      <rect width="176" height="46" rx="23" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".22"/>
      <g transform="translate(18 11)" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round">
        <path d="M2 7h5l2.5-4h7L19 7h5v15H2z"/>
        <circle cx="13" cy="14" r="4.5"/>
      </g>
      <text x="54" y="30" fill="#ffffff" font-size="18" font-weight="800">Snap a page</text>
    </g>

    <!-- arrow: AI extracts -->
    <path d="M320 250C332 239 340 235 352 234" fill="none" stroke="#f0b544" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

    <!-- 2. Review extracted pairs -->
    <g transform="translate(354 150)">
      <g filter="url(#soft)">
        <rect width="214" height="246" rx="18" fill="#ffffff"/>
      </g>
      <rect x="14" y="14" width="88" height="28" rx="14" fill="#fbe6e0"/>
      <g transform="translate(24 20)" fill="#c8442b">
        <path d="M8 0l2.2 5.8L16 8l-5.8 2.2L8 16l-2.2-5.8L0 8l5.8-2.2z"/>
      </g>
      <text x="46" y="33" fill="#c8442b" font-size="13" font-weight="850" letter-spacing="1.2">AI READ</text>
      <text x="200" y="33" text-anchor="end" fill="#7a706a" font-size="13" font-weight="700">5 pairs</text>
      <g font-size="14" font-weight="700" fill="#23201d">
        <g transform="translate(14 56)">
          <rect width="92" height="36" rx="10" fill="#fdf6ef" stroke="#e5d9cc"/>
          <rect x="100" width="70" height="36" rx="10" fill="#fdf6ef" stroke="#e5d9cc"/>
          <text x="10" y="23">la bandera</text>
          <text x="110" y="23">flag</text>
          <path d="M176 18l5 5 9-10" fill="none" stroke="#2e8b57" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(14 100)">
          <rect width="92" height="36" rx="10" fill="#fdf6ef" stroke="#e5d9cc"/>
          <rect x="100" width="70" height="36" rx="10" fill="#fdf6ef" stroke="#e5d9cc"/>
          <text x="10" y="23">la capital</text>
          <text x="110" y="23">capital</text>
          <path d="M176 18l5 5 9-10" fill="none" stroke="#2e8b57" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(14 144)">
          <rect width="92" height="36" rx="10" fill="#fdf6ef" stroke="#c8442b" stroke-width="2"/>
          <rect x="100" width="70" height="36" rx="10" fill="#fdf6ef" stroke="#e5d9cc"/>
          <text x="10" y="23">la chica</text>
          <rect x="66" y="9" width="2" height="18" fill="#c8442b"/>
          <text x="110" y="23">girl</text>
          <g transform="translate(177 9)" fill="#c8442b">
            <path d="M2 14l1-4 8-8 3 3-8 8z"/>
            <rect x="0" y="16" width="14" height="2" rx="1"/>
          </g>
        </g>
        <g transform="translate(14 188)" opacity=".55">
          <rect width="92" height="36" rx="10" fill="#fdf6ef" stroke="#e5d9cc"/>
          <rect x="100" width="70" height="36" rx="10" fill="#fdf6ef" stroke="#e5d9cc"/>
          <text x="10" y="23">el chico</text>
          <text x="110" y="23">boy</text>
        </g>
      </g>
    </g>

    <!-- step label: review -->
    <g transform="translate(369 420)">
      <rect width="184" height="46" rx="23" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".22"/>
      <g transform="translate(18 12)" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="10"/>
        <path d="M6 11.5l3.5 3.5L16 8"/>
      </g>
      <text x="52" y="30" fill="#ffffff" font-size="18" font-weight="800">Check &amp; fix</text>
    </g>

    <!-- install / offline -->
    <g transform="translate(376 484)">
      <rect x="0" y="0" width="46" height="46" rx="12" fill="#c8442b" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.5"/>
      <rect x="9" y="8" width="21" height="19" rx="4" fill="#ffffff" fill-opacity=".38"/>
      <rect x="13" y="14" width="24" height="23" rx="4" fill="#ffffff"/>
      <rect x="17" y="21" width="14" height="3" rx="1.5" fill="#c8442b"/>
      <rect x="17" y="28" width="9" height="3" rx="1.5" fill="#c8442b"/>
      <text x="58" y="20" fill="#f0b544" font-size="12" font-weight="850" letter-spacing="1.4">PHONE APP</text>
      <text x="58" y="40" fill="#ffffff" font-size="16" font-weight="750">Works offline</text>
    </g>

    <!-- arrow to phone -->
    <path d="M570 272C574 272 576 272 580 272" fill="none" stroke="#f0b544" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

    <!-- 3. Phone with the real flashcard UI -->
    <g filter="url(#shadow)">
      <rect x="586" y="60" width="244" height="500" rx="38" fill="#23201d"/>
      <rect x="598" y="74" width="220" height="472" rx="28" fill="#fdf6ef"/>
    </g>
    <rect x="678" y="84" width="60" height="7" rx="3.5" fill="#23201d"/>

    <g transform="translate(598 74)">
      <!-- top bar -->
      <text x="16" y="44" fill="#7a706a" font-size="11" font-weight="800" letter-spacing="1.8">ESPAÑOL</text>
      <circle cx="194" cy="40" r="13" fill="none" stroke="#e5d9cc"/>
      <g fill="#7a706a"><circle cx="188.5" cy="40" r="1.6"/><circle cx="194" cy="40" r="1.6"/><circle cx="199.5" cy="40" r="1.6"/></g>

      <!-- deck title -->
      <text x="16" y="78" fill="#23201d" font-size="17" font-weight="800" letter-spacing="-.3">¿De dónde eres?</text>
      <text x="16" y="96" fill="#7a706a" font-size="11">Vocabulario</text>

      <!-- icon buttons: speak, star, known -->
      <g transform="translate(16 110)">
        <circle cx="17" cy="17" r="17" fill="#fbe6e0" stroke="#c8442b" stroke-width="1.5"/>
        <g transform="translate(7 7) scale(.85)">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="#c8442b"/>
          <path d="M16 8.5a4.5 4.5 0 0 1 0 7" fill="none" stroke="#c8442b" stroke-width="1.9" stroke-linecap="round"/>
          <path d="M18.6 5.9a8 8 0 0 1 0 12.2" fill="none" stroke="#c8442b" stroke-width="1.9" stroke-linecap="round"/>
        </g>
        <circle cx="61" cy="17" r="17" fill="#ffffff" stroke="#d99518" stroke-width="1.5"/>
        <path d="M61 7.5l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3-5.6-3-5.6 3 1.1-6.3-4.6-4.4 6.3-.9z" fill="#d99518"/>
        <circle cx="105" cy="17" r="17" fill="#ffffff" stroke="#e5d9cc"/>
        <path d="M97 17.5l5 5 9-10" fill="none" stroke="#23201d" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- progress -->
      <rect x="16" y="160" width="152" height="6" rx="3" fill="#f5ece2"/>
      <rect x="16" y="160" width="25" height="6" rx="3" fill="#c8442b"/>
      <text x="204" y="167" text-anchor="end" fill="#7a706a" font-size="11">1 / 6</text>

      <!-- flashcard -->
      <g filter="url(#soft)">
        <rect x="16" y="182" width="188" height="170" rx="18" fill="#ffffff" stroke="#e5d9cc"/>
      </g>
      <text x="110" y="240" text-anchor="middle" fill="#7a706a" font-size="11" font-weight="800" letter-spacing="1.5">ESPAÑOL</text>
      <text x="110" y="282" text-anchor="middle" fill="#23201d" font-size="31" font-weight="850" letter-spacing="-.6">la bandera</text>
      <text x="110" y="312" text-anchor="middle" fill="#7a706a" font-size="11">tap to flip</text>

      <!-- nav -->
      <rect x="16" y="366" width="42" height="42" rx="12" fill="#ffffff" stroke="#e5d9cc"/>
      <path d="M44 387H30m5-5l-5 5 5 5" fill="none" stroke="#23201d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="64" y="366" width="92" height="42" rx="12" fill="#c8442b"/>
      <text x="110" y="393" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="750">Flip</text>
      <rect x="162" y="366" width="42" height="42" rx="12" fill="#ffffff" stroke="#e5d9cc"/>
      <path d="M176 387h14m-5-5l5 5-5 5" fill="none" stroke="#23201d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- tools -->
      <rect x="16" y="420" width="90" height="30" rx="15" fill="none" stroke="#e5d9cc"/>
      <text x="61" y="440" text-anchor="middle" fill="#7a706a" font-size="11" font-weight="700">ES → EN</text>
      <rect x="114" y="420" width="90" height="30" rx="15" fill="#fbe6e0" stroke="#c8442b"/>
      <text x="159" y="440" text-anchor="middle" fill="#c8442b" font-size="11" font-weight="700">★ Starred</text>
    </g>
  </g>
</svg>
