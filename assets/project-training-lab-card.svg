<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Interactive training lab: geometry proof practice app</title>
  <desc id="desc">A dark practice-app screen. On the left, two parallel lines m and n are cut by a transversal t, with angles numbered 1 to 8 and corresponding angles 1 and 5 highlighted. On the right, a two-column Statements and Reasons proof is checked line by line: two lines are marked correct, one is marked wrong, and a hint says angles 5 and 8 are vertical angles. A badge shows Level 3, Rank: Gold and plus 30 points.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f1923"/>
      <stop offset="1" stop-color="#172634"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1e2c39"/>
      <stop offset="1" stop-color="#18242f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0b1219" flood-opacity=".28"/>
    </filter>
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#3ce0c5" flood-opacity=".9"/>
    </filter>
    <filter id="glowText" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#3ce0c5" flood-opacity=".7"/>
    </filter>
    <clipPath id="panelClip"><rect x="50" y="54" width="800" height="512" rx="28"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ece8e1"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#f4f8f6"/>
  <g filter="url(#shadow)">
    <rect x="50" y="54" width="800" height="512" rx="28" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#panelClip)"><circle cx="800" cy="96" r="120" fill="#ff4655" opacity=".07"/>
  <circle cx="96" cy="540" r="130" fill="#3ce0c5" opacity=".06"/></g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="86" y="102" fill="#ff4655" font-size="14" font-weight="850" letter-spacing="2.4">PROOF LAB</text>
    <text x="86" y="134" fill="#ece8e1" font-size="27" font-weight="850">Prove <tspan fill="#3ce0c5">∠1 ≅ ∠8</tspan></text>

    <g transform="translate(530 82)">
      <rect width="284" height="62" rx="14" fill="#1b2733" stroke="#ffffff" stroke-opacity=".12"/>
      <path d="M31 13 l13 6 v11 c0 9 -6 14 -13 17 c-7 -3 -13 -8 -13 -17 v-11 z" fill="#f5d76e" fill-opacity=".18" stroke="#f5d76e" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M31 22 l2.6 5.2 5.7 .8 -4.1 4 1 5.7 -5.2 -2.7 -5.2 2.7 1 -5.7 -4.1 -4 5.7 -.8 z" fill="#f5d76e"/>
      <text x="58" y="28" fill="#a9b4bd" font-size="13" font-weight="800" letter-spacing="1.4">LEVEL 3</text>
      <text x="58" y="49" fill="#ece8e1" font-size="18" font-weight="850">Rank: Gold</text>
      <rect x="190" y="16" width="80" height="30" rx="15" fill="#3ce0c5" fill-opacity=".14" stroke="#3ce0c5" stroke-opacity=".6"/>
      <text x="230" y="37" text-anchor="middle" fill="#3ce0c5" font-size="16" font-weight="850">+30 pts</text>
    </g>

    <g transform="translate(86 168)">
      <rect width="300" height="366" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity=".1"/>
      <g transform="translate(0 4)"><g><path d="M176.8,95.0 L188.2,71.6 A26,26 0 0 0 150.8,95.0 Z" fill="rgba(60,224,197,.3)" stroke="#3ce0c5" stroke-width="2.2" filter="url(#glow1)"/><path d="M123.2,205.0 L134.6,181.6 A26,26 0 0 0 97.2,205.0 Z" fill="rgba(60,224,197,.3)" stroke="#3ce0c5" stroke-width="2.2" filter="url(#glow1)"/></g><g><line x1="18.0" y1="95.0" x2="282.0" y2="95.0" stroke="#ece8e1" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><polyline points="207.0,101.0 215.0,95.0 207.0,89.0" fill="none" stroke="#f5d76e" stroke-width="2.4"/><line x1="18.0" y1="205.0" x2="282.0" y2="205.0" stroke="#ece8e1" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><polyline points="207.0,211.0 215.0,205.0 207.0,199.0" fill="none" stroke="#f5d76e" stroke-width="2.4"/><line x1="87.6" y1="278.0" x2="212.4" y2="22.0" stroke="#ece8e1" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/></g><g><text x="290.0" y="101.0" text-anchor="middle" fill="#ece8e1" font-size="20" font-style="italic" font-weight="600">m</text><text x="290.0" y="211.0" text-anchor="middle" fill="#ece8e1" font-size="20" font-style="italic" font-weight="600">n</text><text x="230.6" y="18.0" text-anchor="middle" fill="#ece8e1" font-size="20" font-style="italic" font-weight="600">t</text><text x="156.7" y="69.8" text-anchor="middle" fill="#3ce0c5" font-size="21" font-weight="800">1</text><text x="194.6" y="89.9" text-anchor="middle" fill="#ece8e1" fill-opacity=".72" font-size="17" font-weight="600">2</text><text x="159.0" y="112.1" text-anchor="middle" fill="#ece8e1" fill-opacity=".72" font-size="17" font-weight="600">3</text><text x="188.0" y="118.8" text-anchor="middle" fill="#ece8e1" fill-opacity=".72" font-size="17" font-weight="600">4</text><text x="103.0" y="179.8" text-anchor="middle" fill="#3ce0c5" font-size="21" font-weight="800">5</text><text x="141.0" y="199.9" text-anchor="middle" fill="#ece8e1" fill-opacity=".72" font-size="17" font-weight="600">6</text><text x="105.4" y="222.1" text-anchor="middle" fill="#ece8e1" fill-opacity=".72" font-size="17" font-weight="600">7</text><text x="134.3" y="228.8" text-anchor="middle" fill="#ece8e1" fill-opacity=".72" font-size="17" font-weight="600">8</text></g></g>
      <line x1="20" y1="314" x2="280" y2="314" stroke="#2e3d4b" stroke-width="1.5"/>
      <text x="150" y="346" text-anchor="middle" fill="#a9b4bd" font-size="17" font-weight="700">Given: <tspan fill="#ece8e1" font-style="italic">m</tspan><tspan fill="#ece8e1"> ∥ </tspan><tspan fill="#ece8e1" font-style="italic">n</tspan></text>
    </g>

    <g transform="translate(404 168)">
      <rect width="410" height="366" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="22" y="38" fill="#a9b4bd" font-size="13" font-weight="850" letter-spacing="1.2">STATEMENTS</text>
      <text x="150" y="38" fill="#a9b4bd" font-size="13" font-weight="850" letter-spacing="1.2">REASONS</text>
      <line x1="14" y1="52" x2="396" y2="52" stroke="#ff4655" stroke-width="2.5"/>
      <line x1="138" y1="53" x2="138" y2="248" stroke="#2e3d4b" stroke-width="2"/>

      <rect x="14" y="54" width="352" height="46" fill="#3ce0c5" fill-opacity=".1"/>
      <text x="22" y="84" fill="#ece8e1" font-size="20" font-weight="700" font-style="italic">m <tspan font-style="normal">∥</tspan> n</text>
      <text x="150" y="84" fill="#a9b4bd" font-size="17" font-style="italic">Given</text>
      <text x="382" y="86" text-anchor="middle" fill="#3ce0c5" font-size="24" font-weight="850" filter="url(#glowText)">✓</text>
      <line x1="14" y1="100" x2="396" y2="100" stroke="#2e3d4b" stroke-width="1.5"/>

      <rect x="14" y="101" width="352" height="94" fill="#3ce0c5" fill-opacity=".1"/>
      <text x="22" y="132" fill="#ece8e1" font-size="20" font-weight="700">∠1 ≅ ∠5</text>
      <text x="150" y="130" fill="#a9b4bd" font-size="17" font-style="italic">If the lines are parallel,</text>
      <text x="150" y="153" fill="#a9b4bd" font-size="17" font-style="italic">then corresponding angles</text>
      <text x="150" y="176" fill="#a9b4bd" font-size="17" font-style="italic">are congruent.</text>
      <text x="382" y="156" text-anchor="middle" fill="#3ce0c5" font-size="24" font-weight="850" filter="url(#glowText)">✓</text>
      <line x1="14" y1="195" x2="396" y2="195" stroke="#2e3d4b" stroke-width="1.5"/>

      <text x="22" y="228" fill="#ece8e1" font-size="20" font-weight="700">∠5 ≅ ∠8</text>
      <rect x="148" y="206" width="196" height="32" rx="6" fill="#ff4655" fill-opacity=".14" stroke="#ff4655" stroke-opacity=".7"/>
      <text x="160" y="228" fill="#ffb3b9" font-size="17" font-style="italic">Linear Pair</text>
      <text x="382" y="230" text-anchor="middle" fill="#ff4655" font-size="24" font-weight="850">✗</text>
      <line x1="14" y1="248" x2="396" y2="248" stroke="#2e3d4b" stroke-width="1.5"/>

      <g transform="translate(14 266)">
        <rect width="382" height="80" rx="4" fill="#f5d76e" fill-opacity=".12"/>
        <rect width="4" height="80" fill="#f5d76e"/>
        <text x="20" y="28" fill="#f5d76e" font-size="13" font-weight="850" letter-spacing="2">HINT 1 OF 3</text>
        <text x="20" y="58" fill="#ece8e1" font-size="19" font-weight="650">∠5 and ∠8 are vertical angles.</text>
      </g>
    </g>
  </g>
</svg>
