# /etc/nginx/sites-available/datasailsolutions.com on the sentrysail box.
# Mirrors the live config (certbot-managed lines included) plus a dotfile block
# so .git and similar are never served. After editing on the server:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name datasailsolutions.com www.datasailsolutions.com;

    root /var/www/datasail-site;
    index index.html;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|jpg|jpeg|png|svg|ico|webp)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/datasailsolutions.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/datasailsolutions.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.datasailsolutions.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = datasailsolutions.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name datasailsolutions.com www.datasailsolutions.com;
    return 404; # managed by Certbot
}
