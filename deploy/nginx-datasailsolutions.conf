# /etc/nginx/sites-available/datasailsolutions
# Enable with:
#   sudo ln -s /etc/nginx/sites-available/datasailsolutions /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then add HTTPS with:
#   sudo certbot --nginx -d datasailsolutions.com -d www.datasailsolutions.com

server {
    listen 80;
    listen [::]:80;
    server_name datasailsolutions.com www.datasailsolutions.com;

    root /var/www/datasailsolutions;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ /\. {
        deny all;
    }
}
